services:
  neural-process-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: neural-process-twin:latest
    container_name: neural-process-twin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NPT_MAX_CONCURRENT_NUMERICAL_SOLVES=4
      - NPT_MAX_CONCURRENT_NEURAL_INFERENCES=8
      - NPT_MAX_REQUEST_BODY_BYTES=10485760
      - NPT_CONCURRENCY_QUEUE_TIMEOUT_SECONDS=5.0
      - NPT_REQUEST_EXECUTION_TIMEOUT_SECONDS=30.0
      - NPT_ENABLE_METRICS=true
      - NPT_CORS_ALLOWED_ORIGINS=*
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

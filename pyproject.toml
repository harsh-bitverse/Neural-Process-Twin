[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-process-twin"
version = "0.1.0.dev0"
description = "Physics-aware machine learning surrogate simulator for physical field prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Neural Process Twin Contributors" }
]
keywords = [
    "scientific-machine-learning",
    "physics-informed-neural-networks",
    "neural-operators",
    "digital-twin",
    "partial-differential-equations",
    "heat-conduction",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "h5py>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_process_twin"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length violations (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["neural_process_twin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests for standalone components and configuration parsing.",
    "integration: Integration tests verifying cross-module configuration and workflows.",
    "scientific: Scientific verification tests (manufactured solutions, mesh convergence, flux balance).",
]

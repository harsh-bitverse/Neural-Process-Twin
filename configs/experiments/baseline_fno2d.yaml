# ==============================================================================
# Neural Process Twin - Baseline Experiment: FNO-2D
# ==============================================================================
experiment_name: "baseline_fno2d"
description: "Fourier Neural Operator (FNO-2D) surrogate baseline on 2D steady-state heat conduction"
config_status: "active"

model:
  architecture: "fno2d"
  in_channels: 12
  out_channels: 1
  modes_x: 12
  modes_y: 12
  width: 32
  depth: 4

optimization:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    type: "cosine_annealing"
    warmup_epochs: 5
    min_lr: 1.0e-6

loss:
  data_loss:
    type: "relative_l2"
    weight: 1.0
  physics_loss:
    enabled: false
    weight: 0.0

training:
  seed: 42
  batch_size: 16
  epochs: 50
  gradient_clip_norm: 1.0
  checkpoint_frequency: 10
  early_stopping:
    enabled: true
    patience: 15
    metric: "val_loss"

hardware:
  device: "auto"
  num_workers: 0
  mixed_precision: false
